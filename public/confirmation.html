<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email Verified - Bible Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            padding: 20px;
            color: #ffffff;
        }

        .card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 40px 28px;
            width: 100%;
            max-width: 380px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 40px rgba(56, 239, 125, 0.15);
            animation: popIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes popIn {
            from {
                transform: scale(0.85);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .icon-circle {
            width: 84px;
            height: 84px;
            border-radius: 50%;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            box-shadow: 0 10px 25px rgba(56, 239, 125, 0.4);
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 10px 25px rgba(56, 239, 125, 0.4);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 14px 32px rgba(56, 239, 125, 0.6);
            }
        }

        .icon-symbol {
            color: white;
            font-size: 42px;
            font-weight: 800;
            line-height: 1;
        }

        h2 {
            color: #ffffff;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: -0.3px;
        }

        p {
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .btn-continue {
            background: linear-gradient(135deg, #38ef7d 0%, #11998e 100%);
            border: none;
            padding: 14px 24px;
            width: 100%;
            border-radius: 14px;
            color: #064e3b;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 8px 20px rgba(56, 239, 125, 0.35);
        }

        .btn-continue:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 26px rgba(56, 239, 125, 0.5);
        }

        .btn-continue:active {
            transform: translateY(0);
        }

        .countdown {
            font-size: 12px;
            color: #38ef7d;
            margin-top: 14px;
            font-weight: 600;
        }

        .subtext {
            margin-top: 18px;
            font-size: 12px;
            color: #64748b;
            margin-bottom: 0;
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="icon-circle" id="statusIcon">
            <span class="icon-symbol" id="iconText">✓</span>
        </div>
        <h2 id="titleText">Email Verified!</h2>
        <p id="descText">Your email has been successfully confirmed. You're all set to play Bible Quiz!</p>

        <!-- Deep Link Button to Redirect to App Home -->
        <a id="appRedirectLink" href="biblequiz://home" style="text-decoration: none;">
            <button class="btn-continue" type="button">
                <span>Continue to Home</span>
                <span>➔</span>
            </button>
        </a>

        <div class="countdown" id="countdownText">Redirecting to app in 3s...</div>
        <p class="subtext">If the app doesn't open automatically, tap the button above.</p>
    </div>

    <script>
        // Check for error parameters in URL (Supabase appends error description)
        const params = new URLSearchParams(window.location.search);
        const error = params.get('error_description') || params.get('error');

        if (error) {
            document.getElementById("titleText").innerText = "Verification Failed";
            document.getElementById("descText").innerText = error;
            document.getElementById("statusIcon").style.background = "linear-gradient(135deg, #ef4444 0%, #b91c1c 100%)";
            document.getElementById("statusIcon").style.boxShadow = "0 10px 25px rgba(239, 68, 68, 0.4)";
            document.getElementById("iconText").innerText = "✕";
            document.getElementById("countdownText").style.display = "none";
            document.querySelector(".btn-continue").innerText = "Return to App";
        } else {
            // Construct deep link carrying tokens/params so the app can auto-login and open Home
            const query = window.location.search || '';
            const hash = window.location.hash || '';
            const deepLinkUrl = 'biblequiz://home' + query + hash;
            
            const redirectLink = document.getElementById("appRedirectLink");
            redirectLink.href = deepLinkUrl;

            // Auto-redirect countdown
            let timeLeft = 3;
            const countdownEl = document.getElementById("countdownText");
            
            const timer = setInterval(() => {
                timeLeft -= 1;
                if (timeLeft > 0) {
                    countdownEl.innerText = `Redirecting to app in ${timeLeft}s...`;
                } else {
                    clearInterval(timer);
                    countdownEl.innerText = `Opening Bible Quiz...`;
                    window.location.href = deepLinkUrl;
                }
            }, 1000);

            // If user clicks the button manually, navigate immediately
            redirectLink.addEventListener('click', (e) => {
                clearInterval(timer);
                countdownEl.innerText = `Opening Bible Quiz...`;
                window.location.href = deepLinkUrl;
            });
        }
    </script>
</body>

</html>
