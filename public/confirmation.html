<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email Confirmed</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .card {
            background: #ffffff;
            padding: 40px 30px;
            width: 320px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            animation: pop 0.6s ease;
        }

        @keyframes pop {
            from {
                transform: scale(0.7);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .checkmark {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #4CAF50;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }

        .checkmark::after {
            content: "✓";
            color: white;
            font-size: 40px;
            font-weight: bold;
        }

        h2 {
            color: #333;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }

        button {
            background: #667eea;
            border: none;
            padding: 12px 20px;
            width: 100%;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        button:hover {
            background: #5a67d8;
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="checkmark"></div>
        <h2>Email Verified!</h2>
        <p>Your email has been successfully confirmed.</p>
        <p>You can now return to the app and login.</p>

        <!-- Deep Link to Open App -->
        <a href="biblequiz://auth" style="text-decoration: none;">
            <button>Open App 📱</button>
        </a>

        <p style="margin-top: 15px; font-size: 12px; color: #999;">If app doesn't open, please close this window
            manually.</p>
    </div>

    <script>
        // Check for error parameters in URL (Supabase appends error description)
        const params = new URLSearchParams(window.location.search);
        const error = params.get('error_description');
        if (error) {
            document.querySelector("h2").innerText = "Verification Failed";
            document.querySelector("p").innerText = error;
            document.querySelector(".checkmark").style.background = "#f44336";
            document.querySelector(".checkmark").innerHTML = "<span style='color:white;font-size:40px;font-weight:bold'>✕</span>";
        }
    </script>
</body>

</html>
