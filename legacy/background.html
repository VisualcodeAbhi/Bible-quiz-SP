<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Starry Background</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: url(images/test1.jpeg);
      background-repeat: no-repeat;
      background-size: cover;
      background-attachment: fixed;
      overflow: hidden;
      min-height: 100vh;
      position: relative;
    }

    /* Starry background container */
    .stars {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    /* Individual stars */
    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: twinkle var(--duration) ease-in-out infinite;
      box-shadow: 0 0 var(--glow) var(--color);
    }

    @keyframes twinkle {

      0%,
      100% {
        opacity: 0.3;
        transform: scale(1);
      }

      50% {
        opacity: 1;
        transform: scale(1.2);
      }
    }

    /* Shooting stars */
    /* Shooting stars */
    @keyframes shootingStar {
      0% {
        transform: translateX(0) translateY(0) rotate(-45deg);
        opacity: 1;
      }

      100% {
        transform: translateX(-100vh) translateY(100vh) rotate(-45deg);
        opacity: 0;
      }
    }

    .shooting-star {
      position: absolute;
      width: 100px;
      height: 2px;
      background: linear-gradient(90deg, white, transparent);
      border-radius: 50%;
      box-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
      animation: shootingStar 2s linear infinite;
      opacity: 0;
    }
  </style>
</head>

<body>
  <!-- Starry background container -->
  <div class="stars" id="stars-container"></div>

  <script>
    // Create starry background
    const starsContainer = document.getElementById('stars-container');
    const starCount = 400;

    for (let i = 0; i < starCount; i++) {
      const star = document.createElement('div');
      star.className = 'star';

      // Random position
      star.style.left = Math.random() * 100 + '%';
      star.style.top = Math.random() * 100 + '%';

      // Random size (1-3px)
      const size = Math.random() * 2 + 1;
      star.style.width = size + 'px';
      star.style.height = size + 'px';

      // Random animation duration (2-5s)
      const duration = Math.random() * 3 + 2;
      star.style.setProperty('--duration', duration + 's');

      // Random glow
      const glow = Math.random() * 3 + 2;
      star.style.setProperty('--glow', glow + 'px');
      star.style.setProperty('--color', 'rgba(255, 255, 255, 0.8)');

      // Random delay
      star.style.animationDelay = Math.random() * 5 + 's';

      starsContainer.appendChild(star);
    }

    // Create shooting stars
    function createShootingStar() {
      const shootingStar = document.createElement('div');
      shootingStar.className = 'shooting-star';

      // Start from right/top side
      shootingStar.style.left = Math.random() * 100 + 20 + '%'; // offset to start slightly off screen if moving left
      shootingStar.style.top = Math.random() * 50 - 20 + '%';   // offset to start slightly above

      // Adjust start position logic since we are moving -100vh, +100vh
      // We want them to generally cross the screen
      shootingStar.style.left = Math.random() * 120 + '%';
      shootingStar.style.top = Math.random() * 50 - 20 + '%';

      starsContainer.appendChild(shootingStar);

      setTimeout(() => {
        shootingStar.remove();
      }, 3000);
    }

    // Create a shooting star frequently
    setInterval(() => {
      createShootingStar();
    }, 800);
  </script>
</body>

</html>
