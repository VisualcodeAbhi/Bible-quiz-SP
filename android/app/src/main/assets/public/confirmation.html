<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email Verified - Bible Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            padding: 20px;
            color: #ffffff;
        }

        .card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 40px 28px;
            width: 100%;
            max-width: 380px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 40px rgba(56, 239, 125, 0.15);
            animation: popIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes popIn {
            from {
                transform: scale(0.85);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .icon-circle {
            width: 84px;
            height: 84px;
            border-radius: 50%;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            box-shadow: 0 10px 25px rgba(56, 239, 125, 0.4);
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 10px 25px rgba(56, 239, 125, 0.4);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 14px 32px rgba(56, 239, 125, 0.6);
            }
        }

        .icon-symbol {
            color: white;
            font-size: 42px;
            font-weight: 800;
            line-height: 1;
        }

        h2 {
            color: #ffffff;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: -0.3px;
        }

        p {
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .btn-continue {
            background: linear-gradient(135deg, #38ef7d 0%, #11998e 100%);
            border: none;
            padding: 14px 24px;
            width: 100%;
            border-radius: 14px;
            color: #064e3b;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 8px 20px rgba(56, 239, 125, 0.35);
        }

        .btn-continue:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 26px rgba(56, 239, 125, 0.5);
        }

        .btn-continue:active {
            transform: translateY(0);
        }

        .countdown {
            font-size: 12px;
            color: #38ef7d;
            margin-top: 14px;
            font-weight: 600;
        }

        .subtext {
            margin-top: 18px;
            font-size: 12px;
            color: #64748b;
            margin-bottom: 0;
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="icon-circle" id="statusIcon">
            <span class="icon-symbol" id="iconText">✓</span>
        </div>
        <h2 id="titleText">Email Verified!</h2>
        <p id="descText">Your email has been successfully confirmed. You're all set to play Bible Quiz!</p>

        <!-- Continue Button -->
        <button id="btnContinue" class="btn-continue" type="button">
            <span>Continue to Home</span>
            <span>➔</span>
        </button>

        <div class="countdown" id="countdownText">Redirecting to app in 3s...</div>
        <p class="subtext">If the app doesn't open automatically, tap the button above.</p>
    </div>

    <script>
        // Initialize Supabase Client to capture and save session into localStorage
        const SUPABASE_URL = 'https://pxzkmwrbqtgyojsephtn.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB4emttd3JicXRneW9qc2VwaHRuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU3MDg4MjAsImV4cCI6MjA4MTI4NDgyMH0.GzBeOlCbMUcDG2EC8RS7TEJsVFcrU3BX3bEM-Mn3PV4';

        if (window.supabase) {
            try {
                window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            } catch (err) {
                console.warn("Supabase init error on confirmation page:", err);
            }
        }

        // Check for error parameters in URL (Supabase appends error description)
        const params = new URLSearchParams(window.location.search);
        const error = params.get('error_description') || params.get('error');

        const btnContinue = document.getElementById("btnContinue");
        const countdownEl = document.getElementById("countdownText");

        function handleRedirect() {
            const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
            const isNativeCapacitor = window.Capacitor !== undefined;
            const query = window.location.search || '';
            const hash = window.location.hash || '';
            const webHomeUrl = window.location.origin + '/' + query + hash;
            const nativeDeepLink = 'biblequiz://home' + query + hash;

            countdownEl.innerText = "Opening Bible Quiz...";

            if (isMobile && !isNativeCapacitor) {
                // Try launching native Android / iOS deep link
                window.location.href = nativeDeepLink;
                // Fallback to web home if native app doesn't catch it
                setTimeout(() => {
                    window.location.href = webHomeUrl;
                }, 1200);
            } else {
                // Desktop browser or localhost or inside app -> Navigate to web root
                window.location.href = webHomeUrl;
            }
        }

        if (error) {
            document.getElementById("titleText").innerText = "Verification Failed";
            document.getElementById("descText").innerText = error;
            document.getElementById("statusIcon").style.background = "linear-gradient(135deg, #ef4444 0%, #b91c1c 100%)";
            document.getElementById("statusIcon").style.boxShadow = "0 10px 25px rgba(239, 68, 68, 0.4)";
            document.getElementById("iconText").innerText = "✕";
            countdownEl.style.display = "none";
            btnContinue.innerText = "Return to App";
            btnContinue.addEventListener('click', () => {
                window.location.href = window.location.origin + '/';
            });
        } else {
            // Auto-redirect countdown (3 seconds)
            let timeLeft = 3;
            const timer = setInterval(() => {
                timeLeft -= 1;
                if (timeLeft > 0) {
                    countdownEl.innerText = `Redirecting to app in ${timeLeft}s...`;
                } else {
                    clearInterval(timer);
                    handleRedirect();
                }
            }, 1000);

            // Manual button click
            btnContinue.addEventListener('click', () => {
                clearInterval(timer);
                handleRedirect();
            });
        }
    </script>
</body>

</html>
